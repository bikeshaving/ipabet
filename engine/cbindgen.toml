language = "C"
header = "// Generated by cbindgen from engine/src/ffi.rs. Do not hand-edit —\n// regenerate with `cbindgen --config cbindgen.toml -o include/ipabet_engine.h`\n// from engine/ after changing the FFI surface."
include_guard = "IPABET_ENGINE_H"
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true

[export]
prefix = ""
# CEdit.edit_type is a plain int on the Rust side (an invalid enum value
# arriving from C would be undefined behavior), so nothing in the exported
# signatures references CEditType any more — but the shells still name its
# values, so it is exported by force.
include = ["CEditType"]

[fn]
prefix = ""
