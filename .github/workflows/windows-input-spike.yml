name: windows-input-spike

# Does a hosted Windows runner have a desktop real enough to inject keystrokes
# into? The macOS gate cannot answer the equivalent question at all — TCC puts a
# consent dialog in front of synthetic input, and nothing in CI can click it —
# so the Windows port's ceiling is worth establishing before any of it is built
# around an assumption.
#
# Nothing here involves IPAbet. It tests the harness, not the product: if
# keystrokes cannot reach a plain text box on a runner, they will not reach one
# through a text service either, and the Windows gate has to be a local VM.

on:
  push:
    paths:
      - 'windows/tools/sendinput-type-test.ps1'
      - '.github/workflows/windows-input-spike.yml'
  workflow_dispatch:

jobs:
  # x86_64 only. The ARM runners are interactive and on WinSta0, but another
  # window holds the foreground there and will not give it up — not to a
  # SetForegroundWindow loop, not with the foreground lock timeout at zero, not
  # through AttachThreadInput. Injected input goes to the foreground, so the
  # keystroke layer cannot be gated there. The engine itself still is, natively,
  # by windows-parity.
  spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Synthetic keystrokes into a real text field
        run: .\windows\tools\sendinput-type-test.ps1
        shell: pwsh
