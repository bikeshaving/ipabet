name: windows-registration

# Registering a text service is where an input method most often fails
# silently: the COM object is created, the profile is not, and the keyboard
# simply never appears with nothing anywhere saying why. Hosted runners are
# elevated, so the whole path -- regsvr32, enumerate, unregister -- is checkable
# without a Windows machine.

on:
  push:
    paths:
      - 'windows/**'
      - 'engine/**'
      - '.github/workflows/windows-registration.yml'
  pull_request:
  workflow_dispatch:

jobs:
  registration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          cmake -S windows -B windows/build -DCMAKE_BUILD_TYPE=Release
          cmake --build windows/build --config Release

      # Nothing of ours should be registered before we register it: if this
      # passes, the assertion afterwards proves nothing.
      - name: Absent to begin with
        run: |
          .\windows\build\Release\profile-probe.exe assert-present
          if ($LASTEXITCODE -eq 0) { throw "IPAbet was already registered" }
          exit 0

      # Not regsvr32: it reports failure in a message box it cannot show under
      # automation, and /s throws the reason away.
      - name: Register
        run: .\windows\build\Release\profile-probe.exe register .\windows\build\Release\ipabet.dll

      - name: What Windows sees
        run: .\windows\build\Release\profile-probe.exe list

      - name: Registered
        run: .\windows\build\Release\profile-probe.exe assert-present

      # Uninstall has to actually uninstall — a profile left behind is what
      # makes a reinstall register twice.
      - name: Unregister
        run: .\windows\build\Release\profile-probe.exe unregister .\windows\build\Release\ipabet.dll

      # If the profile outlives unregistration again, this says which key kept
      # it alive rather than leaving it to guesswork.
      - name: What is left in the registry
        run: |
          $clsid = '{6B2E1F0C-9A44-4C3B-B0D5-1E7A2C5D8F31}'
          reg query "HKLM\SOFTWARE\Microsoft\CTF\TIP\$clsid" /s 2>&1 | Out-String
          reg query "HKCR\CLSID\$clsid" /s 2>&1 | Out-String
          exit 0

      - name: Gone again
        run: |
          .\windows\build\Release\profile-probe.exe assert-present
          if ($LASTEXITCODE -eq 0) { throw "IPAbet survived unregistration" }
          exit 0
