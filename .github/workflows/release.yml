name: release

# Tag v0.1.1 and this builds what a person downloads: the Windows MSI and the
# Linux packages, each with a provenance attestation saying which commit and
# which workflow produced it. `gh attestation verify` checks that against
# GitHub's transparency log, which is the strongest integrity claim available
# to an unsigned build.
#
# It stops at a DRAFT. Publishing is a person's decision, and with immutable
# releases enabled a published tag cannot be taken back or quietly amended.
# The order of the whole thing is in README.md under Releasing.
#
# The macOS package is not built here: notarization needs Brian's keychain, so
# it is attached to the draft by hand.
#
# The notes are .github/release-notes.md, written for someone who has never
# installed an input method and does not know which processor their computer
# has.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      # A tag that disagrees with the tree would ship a file whose name lies
      # about what is inside it, and four build systems each carry their own
      # copy of the version. v0.1.2-beta.1 carries version 0.1.2: installer
      # versions are numeric, so the prerelease lives in the tag and nowhere
      # else.
      - name: The tag and all four versions agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          tag="${tag#v}"
          ./tools/check-version.sh "${tag%%-*}"

      - name: Build
        run: |
          cmake -S windows -B windows/build -DCMAKE_BUILD_TYPE=Release
          cmake --build windows/build --config Release

      - name: Package
        run: .\windows\package.ps1
        shell: pwsh

      - uses: actions/upload-artifact@v5
        with:
          name: unsigned-msi-${{ matrix.arch }}
          path: windows/build/IPAbet-${{ matrix.arch }}.msi

  # Both MSIs are signed here rather than where they are built: the signing
  # action does not run on Windows ARM runners, and signtool does not care
  # what architecture a file targets. Authentication is OIDC — the `release`
  # environment is what the Entra app's federated credential trusts, so there
  # is no signing secret anywhere in this repository. Attestation happens
  # after signing because it must cover the bytes people download.
  sign:
    needs: windows
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: unsigned-msi-*
          merge-multiple: true
          path: msi

      - uses: azure/login@v3
        with:
          client-id: 0b84766f-d18a-4561-8fde-36196249145f
          tenant-id: 8db12798-4563-4dee-921a-568b6f566380
          subscription-id: ec0bbf8e-85e3-44bc-9a7c-daa565921eff

      - uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: bikeshaving
          certificate-profile-name: public-trust
          files-folder: ${{ github.workspace }}\msi
          files-folder-filter: msi

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: msi/*.msi

      - uses: actions/upload-artifact@v5
        with:
          name: msi
          path: msi/*.msi

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev \
            libibus-1.0-dev cmake build-essential pkg-config

      - name: Build and package
        run: |
          cd linux
          ./build.sh
          ./package.sh

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: linux/build/*.deb

      - uses: actions/upload-artifact@v5
        with:
          name: deb-${{ matrix.arch }}
          path: linux/build/*.deb

  draft:
    needs: [sign, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The unsigned MSIs also land in dist; only the signed ones ship.
          find dist -path '*unsigned*' -delete
          find dist -type f | sort
          # Uploaded without the version in the name, like the MSI: the website
          # links to a fixed URL, and a URL carrying 0.1.2 breaks on release day.
          # A deb states its own version in its metadata, and the tag is above
          # the file list.
          mkdir -p stable
          for f in $(find dist -name '*.deb'); do
            base=$(basename "$f")
            name=${base%%_*}
            arch=$(echo "$base" | sed 's/.*_\(.*\)\.deb/\1/')
            mv "$f" "stable/${name}-${arch}.deb"
          done
          ls stable
          # A tag with a suffix is a prerelease: v0.1.2-beta.1, not v0.1.2.
          case "$TAG" in *-*) PRERELEASE=--prerelease ;; *) PRERELEASE= ;; esac
          gh release create "$TAG" --repo "$REPO" --draft $PRERELEASE \
            --title "IPAbet $TAG" \
            --notes-file .github/release-notes.md \
            $(find dist -type f) $(find stable -type f)
