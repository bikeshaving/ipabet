name: windows-build

# Builds the text service itself. The riskiest part is not the TSF code but the
# seam: a Rust static library linked into an MSVC C++ DLL, where a CRT mismatch
# shows up as duplicate symbols rather than as anything that explains itself.

on:
  push:
    paths:
      - 'windows/**'
      - 'engine/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
  workflow_dispatch:

jobs:
  tsf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S windows -B windows/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build windows/build --config Release
      # Windows draws a text service in the tray by its icon and by nothing
      # else — a profile with no icon shows as the bare language code, which is
      # not a failure any other gate can see.
      - name: The DLL carries its icon
        shell: pwsh
        run: |
          $sig = '[DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconExW(string file, int index, IntPtr[] large, IntPtr[] small, uint count);'
          Add-Type -Name Ico -Namespace W -MemberDefinition $sig
          $n = [W.Ico]::ExtractIconExW("$pwd\windows\build\Release\ipabet.dll", -1, $null, $null, 0)
          Write-Host "$n icon group(s) in ipabet.dll"
          if ($n -lt 1) { throw "no icon resource: the tray would show ENG and nothing else" }

      # The offline claim, checked where Windows cannot enforce it. A text
      # service loads into other people's processes, so no sandbox is ours to
      # apply — but the import table is a property of the DLL itself: no
      # networking library in it means the code has no static path to a
      # socket. Weaker than the macOS entitlement or the Linux seccomp
      # filter, and asserted on every build instead of promised.
      - name: The DLL imports no networking API
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find '**\dumpbin.exe' | Select-Object -First 1
          $imports = & $dumpbin /imports windows\build\Release\ipabet.dll
          $imports | Select-String -Pattern '^\s+\S+\.dll$' | ForEach-Object { $_.Line.Trim() } | Write-Host
          $bad = $imports | Select-String -Pattern 'ws2_32|wsock32|wininet|winhttp|urlmon|winsock'
          if ($bad) { throw "networking import found:`n$($bad -join "`n")" }

      - uses: actions/upload-artifact@v5
        with:
          name: ipabet-tsf-x86_64
          path: |
            windows/build/Release/ipabet.dll
            windows/build/Release/ipabet.json
