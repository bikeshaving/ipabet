name: windows-typing

# Types into Notepad and reads back what Notepad ended up holding.
#
# A real application rather than a purpose-built one. What needs proving is the
# lookback -- the text service reading what it already wrote, which is what
# turns t then shift-H into θ rather than tH -- and that needs a document that
# survives from one keystroke to the next. Writing a text store to test against
# would be testing the test.

on:
  push:
    paths:
      - 'windows/**'
      - 'engine/**'
      - 'spec/**'
      - '.github/workflows/windows-typing.yml'
  pull_request:
  workflow_dispatch:

jobs:
  typing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          cmake -S windows -B windows/build -DCMAKE_BUILD_TYPE=Release -DIPABET_DEBUG=ON
          cmake --build windows/build --config Release

      - name: Register
        run: .\windows\build\Release\profile-probe.exe register .\windows\build\Release\ipabet.dll

      - name: What Windows sees
        run: .\windows\build\Release\profile-probe.exe list

      # Active for the session, so the Notepad started next comes up with it on.
      - name: Make it the active input method
        run: .\windows\build\Release\profile-probe.exe enable-select

      - name: Type into Notepad
        env:
          IPABET_DEBUG_LOG: ${{ github.workspace }}\ipabet-debug.log
        run: .\windows\tools\notepad-type-test.ps1
        shell: pwsh

      - name: What the text service saw
        if: always()
        run: |
          if (Test-Path ipabet-debug.log) { Get-Content ipabet-debug.log }
          else { Write-Host "the text service was never loaded" }
          exit 0

      - name: Unregister
        if: always()
        run: .\windows\build\Release\profile-probe.exe unregister .\windows\build\Release\ipabet.dll
