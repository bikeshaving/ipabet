name: windows-typing

# The layer the macOS gate cannot reach: real keystrokes, through the real text
# service, into a real edit control, with the result read back out of the
# control. Windows has no consent wall in front of synthetic input, so what is
# impossible to automate on one platform is a per-push check on this one.

# Run on request, not on push. The harness does not yet hold a document across
# keystrokes -- see "What the typing gate has established" in windows/README.md
# -- so it would sit red on every push while telling nobody anything new. The
# layers it does not cover are gated by windows-build, windows-registration and
# windows-parity, which do run on push.
on:
  workflow_dispatch:

jobs:
  typing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          cmake -S windows -B windows/build -DCMAKE_BUILD_TYPE=Release -DIPABET_DEBUG=ON
          cmake --build windows/build --config Release

      - name: Register
        run: .\windows\build\Release\profile-probe.exe register .\windows\build\Release\ipabet.dll

      # Whether ctfmon is up decides whether this environment can host a text
      # service at all, which is a different failure from a broken one.
      - name: Text services host
        run: |
          Get-Process ctfmon -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String
          exit 0

      - name: Type
        env:
          IPABET_DEBUG_LOG: ${{ github.workspace }}\ipabet-debug.log
        run: .\windows\build\Release\type-test.exe

      - name: What the text service saw
        if: always()
        run: |
          if (Test-Path ipabet-debug.log) { Get-Content ipabet-debug.log }
          else { Write-Host "the text service was never loaded" }
          exit 0

      - name: Unregister
        if: always()
        run: .\windows\build\Release\profile-probe.exe unregister .\windows\build\Release\ipabet.dll
