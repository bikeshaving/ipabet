name: windows-typing

# Types into Notepad and reads back what Notepad ended up holding.
#
# A real application rather than a purpose-built one. What needs proving is the
# lookback -- the text service reading what it already wrote, which is what
# turns t then shift-H into θ rather than tH -- and that needs a document that
# survives from one keystroke to the next. Writing a text store to test against
# would be testing the test.

on:
  push:
    paths:
      - 'windows/**'
      - 'engine/**'
      - 'spec/**'
      - '.github/workflows/windows-typing.yml'
  pull_request:
  workflow_dispatch:

jobs:
  typing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          cmake -S windows -B windows/build -DCMAKE_BUILD_TYPE=Release -DIPABET_DEBUG=ON
          cmake --build windows/build --config Release

      - name: Register
        run: .\windows\build\Release\profile-probe.exe register .\windows\build\Release\ipabet.dll

      - name: What Windows sees
        run: .\windows\build\Release\profile-probe.exe list

      # Active for the session, so the Notepad started next comes up with it on.
      - name: Make it the active input method
        run: .\windows\build\Release\profile-probe.exe enable-select

      - name: Type into Notepad
        env:
          IPABET_DEBUG_LOG: ${{ github.workspace }}\ipabet-debug.log
        run: .\windows\tools\notepad-type-test.ps1 -Count 60
        shell: pwsh

      # Nearly a quarter of the corpus uses the diacritic layer, and it had no
      # coverage here at all until it turned out not to work.
      - name: The diacritic layer specifically
        env:
          IPABET_DEBUG_LOG: ${{ github.workspace }}\ipabet-debug.log
        run: .\windows\tools\notepad-type-test.ps1 -Count 25 -Only option
        shell: pwsh

      # The same layer through its other key. Ctrl+Alt passing says nothing about
      # right Alt: Windows delivers them separately and each is reserved by name.
      - name: The diacritic layer on right Alt alone
        env:
          IPABET_DEBUG_LOG: ${{ github.workspace }}\ipabet-debug.log
        run: .\windows\tools\notepad-type-test.ps1 -Count 25 -Only option -RightAlt
        shell: pwsh

      - name: What the text service saw
        if: always()
        run: |
          if (-not (Test-Path ipabet-debug.log)) {
            Write-Host "the text service was never loaded"; exit 0
          }
          Get-Content ipabet-debug.log

          # The question this run exists to answer: TSF delivers Alt-modified
          # keys as WM_SYSKEYDOWN, and it is not obvious that a text service is
          # offered them at all. 0x45 is E, the key the diacritic cases press.
          Write-Host ""
          if (Select-String -Path ipabet-debug.log -Pattern 'OnKeyDown vk=0x45' -Quiet) {
            Write-Host "ALT KEYS ARE DELIVERED - the diacritic layer is reachable"
          } else {
            Write-Host "ALT KEYS NEVER ARRIVED - TSF does not offer them, and no"
            Write-Host "choice of modifier fixes that"
          }
          exit 0

      - name: Unregister
        if: always()
        run: .\windows\build\Release\profile-probe.exe unregister .\windows\build\Release\ipabet.dll
