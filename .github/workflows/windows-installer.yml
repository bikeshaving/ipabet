name: windows-installer

# Builds the MSI and then installs it, which is the only way to find out whether
# it installs. An installer that builds is not an installer that works: the
# custom action that registers the text service runs in the elevated half of the
# install and fails there or nowhere.

on:
  push:
    paths:
      - 'windows/**'
      - 'engine/**'
      - 'spec/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
  workflow_dispatch:

jobs:
  installer:
    # Both architectures. An x64 installer on an ARM machine fails outright at
    # the registration step, and if it did not it would be worse: TSF loads the
    # text service into every client process, and a native ARM application
    # cannot load an x64 DLL.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          cmake -S windows -B windows/build -DCMAKE_BUILD_TYPE=Release
          cmake --build windows/build --config Release

      - name: Package
        run: .\windows\package.ps1
        shell: pwsh

      # A text service loads into every application on the system, so a
      # dependency on a redistributable means it fails to load anywhere that
      # has not installed one. CI images ship Visual Studio and would never
      # notice, so the check is on the binary rather than on the install.
      # Imported DLL names sit in the file as plain ASCII, so this needs no
      # Visual Studio tooling — dumpbin is not on the PATH here, and reaching
      # for it is how this check silently passed by erroring.
      - name: No C runtime dependency
        run: |
          $bad = @()
          foreach ($f in 'ipabet.dll','ipabet-register.exe','profile-probe.exe') {
            $path = "windows\build\Release\$f"
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($path))
            $hits = [regex]::Matches($text, 'VCRUNTIME\d+\.dll|MSVCP\d+\.dll') |
              ForEach-Object { $_.Value } | Sort-Object -Unique
            if ($hits) {
              $bad += $f
              Write-Host "$f imports $($hits -join ', ')"
            } else {
              Write-Host "$f needs no redistributable"
            }
          }
          if ($bad.Count) { throw "$($bad -join ', ') would not load on a clean Windows" }

      - name: Nothing registered yet
        run: |
          .\windows\build\Release\profile-probe.exe assert-present
          if ($LASTEXITCODE -eq 0) { throw "IPAbet was registered before installing" }
          exit 0

      - name: Install
        run: |
          $p = Start-Process msiexec -ArgumentList '/i',"windows\build\IPAbet-${{ matrix.arch }}.msi",'/qn','/l*v','install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "msiexec exited $($p.ExitCode)" }

      # The installed copy, not the build tree's — what a user would have.
      - name: Registered, and the files are where they should be
        run: |
          Get-ChildItem (Join-Path $env:ProgramFiles 'IPAbet') | Format-Table -AutoSize | Out-String
          .\windows\build\Release\profile-probe.exe assert-present

      # Every build gets a new product code, so a reinstall is an upgrade only
      # if the package says so. Without it Windows keeps both and the user
      # uninstalls one copy and still has an input method.
      - name: Reinstalling replaces rather than adds
        run: |
          $p = Start-Process msiexec -ArgumentList '/i',"windows\build\IPAbet-${{ matrix.arch }}.msi",'/qn','/l*v','reinstall.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content reinstall.log -Tail 40; throw "msiexec exited $($p.ExitCode)" }

          $roots = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
                   'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          $found = @(Get-ChildItem $roots -ErrorAction SilentlyContinue |
                     ForEach-Object { Get-ItemProperty $_.PSPath } |
                     Where-Object { $_.DisplayName -eq 'IPAbet' })
          $found | Format-Table DisplayName, DisplayVersion, Publisher | Out-String
          if ($found.Count -ne 1) { throw "$($found.Count) copies of IPAbet in Installed Apps" }
          if ($found[0].Publisher -ne 'Bikeshaving') { throw "publisher is $($found[0].Publisher)" }

      - name: Uninstall
        run: |
          $p = Start-Process msiexec -ArgumentList '/x',"windows\build\IPAbet-${{ matrix.arch }}.msi",'/qn','/l*v','uninstall.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 40; throw "msiexec exited $($p.ExitCode)" }

      # The registry is what uninstall must clear, and it is the record a new
      # session reads. The profile enumeration is a session-cached view of it —
      # a running session can keep answering from cache after the keys are gone,
      # the same way a newly installed input method needs a fresh session before
      # it appears. So the keys are the assertion and the enumeration is
      # reported.
      - name: Gone, and nothing left behind
        run: |
          $clsid = '{6B2E1F0C-9A44-4C3B-B0D5-1E7A2C5D8F31}'
          $left = @()
          foreach ($k in "HKLM:\SOFTWARE\Classes\CLSID\$clsid",
                         "HKLM:\SOFTWARE\Microsoft\CTF\TIP\$clsid") {
            if (Test-Path $k) { $left += $k }
          }
          if (Test-Path (Join-Path $env:ProgramFiles 'IPAbet\ipabet.dll')) { $left += 'the files' }
          if ($left.Count) { throw "uninstall left behind: $($left -join ', ')" }
          Write-Host "registry and files are clean"

          .\windows\build\Release\profile-probe.exe assert-present
          if ($LASTEXITCODE -eq 0) {
            Write-Host "note: this session still enumerates it, which is the cache"
          }
          exit 0

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ipabet-msi-${{ matrix.arch }}
          path: |
            windows/build/IPAbet-${{ matrix.arch }}.msi
            install.log
            reinstall.log
            uninstall.log
