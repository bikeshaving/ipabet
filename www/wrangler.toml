name = "ipabet-org"
main = "dist/server/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "npm run build"

# Hashed static assets (audio, client bundles) emitted by shovel build.
# Served asset-first by Workers Static Assets; misses fall through to the
# worker.
[assets]
directory = "dist/public"

[[routes]]
pattern = "ipabet.org"
custom_domain = true
