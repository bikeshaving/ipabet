# Deploys to Cloudflare Workers. Once ipabet.org is registered and on
# Cloudflare, uncomment the route block.
name = "ipabet-org"
main = "dist/server/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

