<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IPA IME — interactive chart</title>
<style>
  :root {
    --ink:#1d1c19; --ink2:#6b6960; --ink3:#a3a096; --bg:#faf9f6; --card:#fff;
    --line:#e5e2d9; --line2:#cfccc0; --hi:#2f5d8a; --hi-bg:#eaf1f8; --dim:#c9c6bb;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.45; }
  .wrap { max-width:1060px; margin:0 auto; padding:36px 20px 80px; }
  h1 { font-size:24px; font-weight:600; margin:0 0 2px; letter-spacing:-0.01em; }
  .sub { color:var(--ink2); font-size:14px; margin:0 0 22px; }
  h2 { font-size:15px; font-weight:600; margin:34px 0 10px; color:var(--ink2);
    text-transform:uppercase; letter-spacing:0.05em; }
  .tc { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .tc input { width:100%; font-family:var(--mono); font-size:17px; padding:9px 12px;
    border:1px solid var(--line2); border-radius:8px; background:var(--bg); color:var(--ink); outline:none; }
  .tc input:focus { border-color:var(--hi); }
  .tc .out { font-size:26px; min-height:38px; padding:8px 2px 0; letter-spacing:0.02em; }
  .tc .hint { font-size:12px; color:var(--ink3); margin-top:4px; font-family:var(--mono); }
  table { border-collapse:collapse; width:100%; background:var(--card);
    border:1px solid var(--line); font-size:13px; }
  th { font-weight:500; color:var(--ink2); padding:6px 4px; border:1px solid var(--line); font-size:11px; }
  th.manner { text-align:left; padding-left:10px; white-space:nowrap; }
  td { border:1px solid var(--line); padding:0; height:52px; }
  td.na { background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--line) 5px,var(--line) 6px); }
  .cellpair { display:flex; height:100%; }
  .half { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; padding:2px 0; }
  .half:hover { background:var(--hi-bg); }
  .half.sel { background:var(--hi-bg); box-shadow:inset 0 0 0 1.5px var(--hi); }
  .half.empty { cursor:default; }
  .half.empty:hover { background:transparent; }
  .g { font-size:19px; line-height:1.1; }
  .g.unmapped { color:var(--dim); }
  .kk { font-family:var(--mono); font-size:10px; color:var(--hi); }
  /* non-pulmonic: 3-column table like the official chart */
  table.np td { height:auto; }
  table.np .npcell { display:flex; align-items:baseline; gap:8px; padding:7px 12px; cursor:pointer; }
  table.np .npcell:hover, table.np .npcell.sel { background:var(--hi-bg); }
  table.np .desc { font-size:12px; color:var(--ink2); }
  .vowelbox { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; }
  .vwrap { position:relative; width:100%; max-width:620px; margin:0 auto; height:360px; }
  .vp { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column;
    align-items:center; cursor:pointer; padding:3px 6px; border-radius:8px; }
  .vp:hover { background:var(--hi-bg); }
  .vp.sel { background:var(--hi-bg); box-shadow:inset 0 0 0 1.5px var(--hi); }
  .others { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:7px 12px; display:flex; align-items:baseline; gap:8px; cursor:pointer; }
  .chip:hover, .chip.sel { background:var(--hi-bg); border-color:var(--hi); }
  .chip .g { font-size:18px; }
  .detail { position:sticky; bottom:12px; margin-top:26px; background:var(--card);
    border:1px solid var(--line2); border-radius:12px; padding:12px 18px;
    display:flex; align-items:center; gap:18px; box-shadow:0 4px 18px rgba(0,0,0,0.06); }
  .detail .big { font-size:34px; min-width:44px; text-align:center; }
  .detail .kb { font-family:var(--mono); font-size:16px; color:var(--hi); font-weight:600; }
  .detail .cp { font-family:var(--mono); font-size:11px; color:var(--ink3); }
  .detail button { margin-left:auto; font-size:14px; padding:7px 14px; border-radius:8px;
    border:1px solid var(--line2); background:var(--bg); cursor:pointer; color:var(--ink); }
  .detail button:hover { border-color:var(--hi); color:var(--hi); }
  .detail button:disabled { opacity:0.5; cursor:wait; }
  .legend { font-size:12px; color:var(--ink3); margin-top:10px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {jsx, renderer} from "https://cdn.jsdelivr.net/npm/@b9g/crank@0.7.8/standalone.js";

const KEYMAP = {"!": "ǃ", "1": "ɨ", "2": "ʔ", "3": "ʕ", "4": "ɾ", "5": "ə", "6": "ɐ", "7": "ħ", "8": "/", "a": "a", "b": "b", "c": "c", "d": "d", "e": "e", "f": "f", "g": "g", "h": "h", "i": "i", "j": "j", "k": "k", "l": "l", "m": "m", "n": "n", "o": "o", "p": "p", "q": "q", "r": "r", "s": "s", "t": "t", "u": "u", "v": "v", "w": "w", "x": "x", "y": "y", "z": "z", "|": "ǀ", "1H": "ɘ", "1W": "ʉ", "2Q": "ʡ", "3Q": "ʢ", "4L": "ɺ", "4R": "ɽ", "4V": "ⱱ", "5H": "ɜ", "5R": "ɚ", "5W": "ɞ", "7Q": "ʜ", "aE": "æ", "aH": "ʌ", "aO": "ɑ", "aW": "ɶ", "bX": "ɓ", "bH": "β", "cH": "ç", "dX": "ɗ", "dH": "ð", "dJ": "ɟ", "dR": "ɖ", "eH": "ɛ", "eR": "ɝ", "eW": "ø", "gX": "ɠ", "gG": "ʛ", "gH": "ɣ", "gJ": "ʝ", "gQ": "ɢ", "hH": "ɦ", "iH": "ɪ", "jX": "ʄ", "kX": "kʼ", "lG": "ʟ", "lJ": "ʎ", "lR": "ɭ", "lU": "ɫ", "mV": "ɱ", "nG": "ŋ", "nJ": "ɲ", "nQ": "ɴ", "nR": "ɳ", "oA": "ɒ", "oE": "œ", "oH": "ɔ", "oU": "ɵ", "oW": "ɤ", "pX": "pʼ", "pH": "ɸ", "qX": "qʼ", "qH": "χ", "rB": "ʙ", "rG": "ʀ", "rH": "ɹ", "rQ": "ʁ", "rR": "ɻ", "sX": "sʼ", "sH": "ʃ", "sJ": "ɕ", "sL": "ɬ", "sR": "ʂ", "tX": "tʼ", "tH": "θ", "tR": "ʈ", "uH": "ʊ", "uW": "ɯ", "vH": "ʋ", "wH": "ʍ", "wJ": "ɥ", "wW": "ɰ", "yH": "ʏ", "zH": "ʒ", "zJ": "ʑ", "zL": "ɮ", "zR": "ʐ", "|B": "ʘ", "|J": "ǂ", "|L": "ǁ"};
const MARKS = {":": "ː", ";": "ˑ", "~": "̃", "0": "̥", "+": "̬", "?": "̰", "#": "ʰ", "/": "́", "\\": "̀", "^": "̂", "%": "̌", "-": "̄", "[": "̪", "]": "̺", "{": "̟", "}": "̠", "<": "̞", ">": "̝", "(": "̜", ")": "̹", "\"": "̈", "=": "̩", "*": "̆", "&": "͡", "'": "ˈ", ",": "ˌ", ".": ".", "_": "‿", "//": "̋", "\\\\": "̏", "\"\"": "̽", "##": "̤", "**": "̯", "[[": "̼", "]]": "̻", "{{": "̘", "}}": "̙", "<<": "ꜜ", ">>": "ꜛ", "%%": "↗", "^^": "↘", "`": "̚"};
const SUPS = {"h": "ʰ", "j": "ʲ", "w": "ʷ", "g": "ˠ", "l": "ˡ", "n": "ⁿ", "s": "ˢ", "x": "ˣ", "m": "ᵐ", "β": "ᵝ", "d": "ᵈ", "t": "ᵗ", "k": "ᵏ", "r": "ʳ", "ʕ": "ˤ", "ʔ": "ˀ", "ɦ": "ʱ", "ɣ": "ˠ"};
const GLYPH2KEY = {};
for (const [k, g] of Object.entries(KEYMAP)) if (!(g in GLYPH2KEY)) GLYPH2KEY[g] = k;
GLYPH2KEY["tʃ"] = "tsH"; GLYPH2KEY["dʒ"] = "dzH";

const PLACES = ["Bilabial","Labiodental","Dental","Alveolar","Postalv.","Retroflex","Palatal","Velar","Uvular","Pharyngeal","Glottal"];
const NA = "na";
const CONSONANTS = [
  ["Plosive",      [["p","b"],[null,null],[null,null],["t","d"],[null,null],["ʈ","ɖ"],["c","ɟ"],["k","g"],["q","ɢ"],[NA],["ʔ",null]]],
  ["Nasal",        [[null,"m"],[null,"ɱ"],[null,null],[null,"n"],[null,null],[null,"ɳ"],[null,"ɲ"],[null,"ŋ"],[null,"ɴ"],[NA],[NA]]],
  ["Trill",        [[null,"ʙ"],[null,null],[null,null],[null,"r"],[null,null],[null,null],[null,null],[NA],[null,"ʀ"],[null,null],[NA]]],
  ["Tap / Flap",   [[null,null],[null,"ⱱ"],[null,null],[null,"ɾ"],[null,null],[null,"ɽ"],[null,null],[NA],[null,null],[null,null],[NA]]],
  ["Fricative",    [["ɸ","β"],["f","v"],["θ","ð"],["s","z"],["ʃ","ʒ"],["ʂ","ʐ"],["ç","ʝ"],["x","ɣ"],["χ","ʁ"],["ħ","ʕ"],["h","ɦ"]]],
  ["Lateral fric.",[[NA],[NA],[null,null],["ɬ","ɮ"],[null,null],[null,null],[null,null],[null,null],[null,null],[NA],[NA]]],
  ["Approximant",  [[null,null],[null,"ʋ"],[null,null],[null,"ɹ"],[null,null],[null,"ɻ"],[null,"j"],[null,"ɰ"],[null,null],[null,null],[NA]]],
  ["Lateral appr.",[[NA],[NA],[null,null],[null,"l"],[null,null],[null,"ɭ"],[null,"ʎ"],[null,"ʟ"],[null,null],[NA],[NA]]],
];

const NONPULMONIC = [
  // [Clicks, Voiced implosives, Ejectives] rows — standard chart grouping
  [["ʘ","Bilabial"],       ["ɓ","Bilabial"],  ["pʼ","Bilabial"]],
  [["ǀ","Dental"],         ["ɗ","Dental/alveolar"], ["tʼ","Dental/alveolar"]],
  [["ǃ","(Post)alveolar"], ["ʄ","Palatal"],   ["kʼ","Velar"]],
  [["ǂ","Palatoalveolar"], ["ɠ","Velar"],     ["sʼ","Alveolar fricative"]],
  [["ǁ","Alveolar lateral"],["ʛ","Uvular"],   ["qʼ","Uvular"]],
];

const VOWELS = [
  ["i",8,6],["y",17,6],["ɨ",42,6],["ʉ",51,6],["ɯ",83,6],["u",92,6],
  ["ɪ",22,22],["ʏ",30,22],["ʊ",76,22],
  ["e",17,34],["ø",26,34],["ɘ",47,34],["ɵ",56,34],["ɤ",83,34],["o",92,34],
  ["ə",52,50],
  ["ɛ",26,64],["œ",35,64],["ɜ",52,64],["ɞ",61,64],["ʌ",83,64],["ɔ",92,64],
  ["æ",31,78],["ɐ",57,78],
  ["a",36,92],["ɶ",45,92],["ɑ",83,92],["ɒ",92,92],
];

const OTHER_GROUPS = [
  ["Co-articulated approximants", [["ʍ","voiceless labial-velar"],["w","voiced labial-velar"],["ɥ","labial-palatal"]]],
  ["Epiglottals", [["ʜ","voiceless epiglottal fricative"],["ʢ","voiced epiglottal fricative"],["ʡ","epiglottal plosive"]]],
  ["Alveolo-palatal sibilants", [["ɕ","voiceless"],["ʑ","voiced"]]],
  ["Additional laterals & flaps", [["ɫ","velarized alveolar lateral"],["ɺ","alveolar lateral flap"]]],
];
const AFFRICATES = [["tʃ","tsH"],["dʒ","dzH"],["ts","ts"],["dz","dz"]];

function transcode(input) {
  // transformation semantics, mirroring the IME: each key commits, modifiers
  // and doubled marks transform the previous output character in place.
  const TRANSFORMS = {}, UPGRADES = {};
  for (const [k, g] of Object.entries(KEYMAP))
    if (k.length === 2 && KEYMAP[k[0]]) TRANSFORMS[KEYMAP[k[0]] + k[1]] = g;
  for (const [k, v] of Object.entries(MARKS))
    if (k.length === 2 && k[0] === k[1] && MARKS[k[0]]) UPGRADES[MARKS[k[0]] + k[0]] = v;
  let out = "", fail = false;
  for (const s of input) {
    if (s === " ") { out += " "; continue; }
    const p = [...out].pop();
    if (p && TRANSFORMS[p + s] !== undefined) { out = [...out].slice(0,-1).join("") + TRANSFORMS[p + s]; continue; }
    if (p && UPGRADES[p + s] !== undefined) { out = [...out].slice(0,-1).join("") + UPGRADES[p + s]; continue; }
    if (s === "R" && p && "iyɨʉɯuɪʏʊeøɘɵɤoəɛœɜɞʌɔæɐaɶɑɒ".includes(p)) { out = [...out].slice(0,-1).join("") + p + "\u02DE"; continue; }
    if (s === "9") { const open = ([...out].filter(c=>c==="[").length > [...out].filter(c=>c==="]").length); out += open ? "]" : "["; continue; }
    if (s === "$") { if (p && SUPS[p]) out = [...out].slice(0,-1).join("") + SUPS[p]; continue; }
    if (MARKS[s]) { out += MARKS[s]; continue; }
    if (KEYMAP[s]) { out += KEYMAP[s]; continue; }
    out += s === s.toUpperCase() && /[a-z]/i.test(s) ? s : "·"; if (!/[A-Za-z]/.test(s)) fail = true;
  }
  return {out, fail};
}

// --- audio: eSpeak-NG via verified Kirshenbaum codes; unverified glyphs stay silent ---
const FORMANTS = {
  "i":[240,2400],"y":[235,2100],"ɨ":[300,1900],"ʉ":[285,1600],"ɯ":[300,1390],"u":[250,595],
  "ɪ":[390,1990],"ʏ":[370,1850],"ʊ":[440,1020],
  "e":[390,2300],"ø":[370,1900],"ɘ":[460,1600],"ɵ":[430,1450],"ɤ":[460,1310],"o":[360,640],
  "ə":[500,1500],"ɝ":[490,1350],"ɚ":[490,1350],
  "ɛ":[610,1900],"œ":[585,1710],"ɜ":[560,1480],"ɞ":[550,1350],"ʌ":[600,1170],"ɔ":[500,700],
  "æ":[800,1720],"ɐ":[680,1300],
  "a":[850,1610],"ɶ":[820,1530],"ɑ":[750,940],"ɒ":[700,760],
};
function formantSynth(F1, F2, rhotic, done) {
  audioCtx = audioCtx || new AudioContext();
  const t = audioCtx.currentTime, dur = 0.9;
  const src = audioCtx.createOscillator();
  src.type = "sawtooth"; src.frequency.value = 120;
  const out = audioCtx.createGain();
  out.gain.setValueAtTime(0, t);
  out.gain.linearRampToValueAtTime(0.22, t + 0.06);
  out.gain.setValueAtTime(0.22, t + dur - 0.15);
  out.gain.linearRampToValueAtTime(0, t + dur);
  const F3 = rhotic ? 1690 : 2900;
  for (const [f, q, amp] of [[F1, 8, 1], [F2, 10, 0.55], [F3, 10, 0.28]]) {
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
    const ga = audioCtx.createGain(); ga.gain.value = amp;
    src.connect(bp); bp.connect(ga); ga.connect(out);
  }
  out.connect(audioCtx.destination);
  src.onended = done; src.start(t); src.stop(t + dur);
}
const KIRSH = {"p":"p","b":"b","t":"t","d":"d","k":"k","g":"g","m":"m","n":"n","s":"s","z":"z","f":"f","v":"v","h":"h","l":"l","w":"w","j":"j","r":"r*","ɹ":"r","x":"x","ʃ":"S","ʒ":"Z","θ":"T","ð":"D","ŋ":"N","tʃ":"tS","dʒ":"dZ","ç":"C","ɲ":"n^","ʎ":"l^","ʈ":"t.","ɖ":"d.","ʂ":"s.","ʐ":"z.","ɳ":"n.","ɭ":"l.","ɻ":"r.","ɽ":"*.","c":"c","ɟ":"J","q":"q","ʔ":"?","β":"B","ɣ":"Q","χ":"X","ʁ":"g\"","ɦ":"h<?>","ɴ":"n\"","ʀ":"r\"","ɾ":"*","ⱱ":"v#","ʙ":"b<trl>","ɬ":"s<lat>","ɮ":"z<lat>","ʋ":"v<apr>","ɰ":"j<vel>","ʟ":"L","ɥ":"j<rnd>","ʍ":"w<vls>","ɫ":"l~","ɺ":"*<lat>","ɕ":"S;","ʑ":"Z;","ʡ":"?\"","ɓ":"b`","ɗ":"d`","ʄ":"J`","ɠ":"g`","pʼ":"p`","tʼ":"t`","kʼ":"k`","qʼ":"q`","sʼ":"s`","ʘ":"p!","ǀ":"t!","ǃ":"c!","ǂ":"c!","ǁ":"l!","i":"i:","e":"e:","a":"a:","o":"o:","u":"u:","y":"y:","ɪ":"I:","ɛ":"E:","æ":"&:","ɑ":"A:","ɒ":"A.:","ɔ":"O:","ʊ":"U:","ʌ":"V:","ə":"@:","ɜ":"3:","ø":"Y:","œ":"W:","ʏ":"I.:","ɨ":"i\":","ʉ":"u\":","ɯ":"u-:","ɤ":"o-:","ɵ":"@.:","ɝ":"3r:","ɘ":"@\":","ɞ":"O\":","ɐ":"a#:"};
let espeakMod = null, audioCtx = null;
async function speak(glyph, done) {
  if (FORMANTS[glyph]) {
    const [F1, F2] = FORMANTS[glyph];
    formantSynth(F1, F2, glyph === "ɝ" || glyph === "ɚ", done);
    return;
  }
  const code = KIRSH[glyph];
  if (!code) { done(); return; }
  try {
    if (!espeakMod) {
      espeakMod = (await import("https://cdn.jsdelivr.net/npm/espeak-ng@1.0.2/dist/espeak-ng.js")).default;
    }
    const text = code.endsWith(":") ? "[[" + code + "]]" : "[[a" + code + "a]]";
    const es = await espeakMod({
      arguments: ["-v","en-us","-s","110","-w","out.wav", text],
      locateFile: (f) => "https://cdn.jsdelivr.net/npm/espeak-ng@1.0.2/dist/" + f,
    });
    const wav = es.FS.readFile("out.wav");
    audioCtx = audioCtx || new AudioContext();
    const buf = await audioCtx.decodeAudioData(wav.buffer.slice(wav.byteOffset, wav.byteOffset + wav.byteLength));
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.connect(audioCtx.destination);
    src.onended = done; src.start();
  } catch (err) { console.error(err); done(); }
}

function Half({glyph, sel, onpick}) {
  if (!glyph) return jsx`<div class="half empty"></div>`;
  const key = GLYPH2KEY[glyph];
  return jsx`
    <div class="half ${sel === glyph ? "sel" : ""}" onclick=${() => onpick(glyph)}>
      <span class="g ${key ? "" : "unmapped"}">${glyph}</span>
      ${key ? jsx`<span class="kk">${key}</span>` : null}
    </div>`;
}

function *App() {
  let sel = null, typed = "", busy = false, vview = "art";
  const ontoggle = () => this.refresh(() => vview = vview === "art" ? "formant" : "art");
  const onpick = (g) => this.refresh(() => sel = g);
  const oninput = (ev) => this.refresh(() => typed = ev.target.value);
  const onspeak = () => {
    if (!sel || busy) return;
    this.refresh(() => busy = true);
    speak(sel, () => this.refresh(() => busy = false));
  };

  for ({} of this) {
    const {out, fail} = transcode(typed);
    const selKey = sel && GLYPH2KEY[sel];
    yield jsx`
      <div class="wrap">
        <h1>IPA IME</h1>
        <p class="sub">Tier 1 — lowercase base · Capital modifier · digit · punctuation. Click a glyph, then ▶ to hear it (synthetic).</p>

        <div class="tc">
          <input placeholder="type here — e.g.  sHip · tRip · 3arabi · |Losa" value=${typed}
            oninput=${oninput} spellcheck="false" autocomplete="off" />
          <div class="out">${out || " "}</div>
          <div class="hint">${fail ? "· = no mapping" : "transformation: keys commit, modifiers transform in place"}</div>
        </div>

        <h2>Pulmonic consonants</h2>
        <table>
          <thead><tr><th class="manner"></th>${PLACES.map((p) => jsx`<th>${p}</th>`)}</tr></thead>
          <tbody>
            ${CONSONANTS.map(([manner, cells]) => jsx`
              <tr>
                <th class="manner">${manner}</th>
                ${cells.map((cell) => cell[0] === NA
                  ? jsx`<td class="na"></td>`
                  : jsx`<td><div class="cellpair">
                      <${Half} glyph=${cell[0]} sel=${sel} onpick=${onpick} />
                      <${Half} glyph=${cell[1]} sel=${sel} onpick=${onpick} />
                    </div></td>`)}
              </tr>`)}
          </tbody>
        </table>
        <p class="legend">Voiceless left, voiced right. Shaded: judged impossible. Every glyph is routed.</p>

        <h2>Non-pulmonic consonants</h2>
        <table class="np">
          <thead><tr><th>Clicks</th><th>Voiced implosives</th><th>Ejectives</th></tr></thead>
          <tbody>
            ${NONPULMONIC.map((row) => jsx`
              <tr>${row.map(([g, desc]) => {
                const key = GLYPH2KEY[g];
                return jsx`<td><div class="npcell ${sel === g ? "sel" : ""}" onclick=${() => onpick(g)}>
                  <span class="g ${key ? "" : "unmapped"}">${g}</span>
                  ${key ? jsx`<span class="kk">${key}</span>` : null}
                  <span class="desc">${desc}</span>
                </div></td>`;
              })}</tr>`)}
          </tbody>
        </table>

        <h2>Affricates &amp; double articulations</h2>
        <p class="legend">No dedicated keys — typed as their component glyphs in sequence.</p>
        <div class="others">
          ${AFFRICATES.map(([g, key]) => jsx`
            <div class="chip ${sel === g ? "sel" : ""}" onclick=${() => onpick(g)}>
              <span class="g">${g}</span><span class="kk">${key}</span>
            </div>`)}
        </div>

        <h2>Other symbols</h2>
        ${OTHER_GROUPS.map(([title, items]) => jsx`
          <div>
            <h3 style="font-size:12px;color:var(--ink3);margin:14px 0 6px;font-weight:600">${title}</h3>
            <div class="others">
              ${items.map(([g, desc]) => {
                const key = GLYPH2KEY[g];
                return jsx`
                  <div class="chip ${sel === g ? "sel" : ""}" onclick=${() => onpick(g)} title=${desc}>
                    <span class="g">${g}</span>
                    ${key ? jsx`<span class="kk">${key}</span>` : jsx`<span class="kk" style="color:var(--dim)">—</span>`}
                  </div>`;
              })}
            </div>
          </div>`)}

        <h2>Marks — diacritics &amp; suprasegmentals</h2>
        <p class="legend">Postfix: a mark attaches to the preceding letter. Doubled keys intensify the family.</p>
        ${[["Length", [[":", "ː"], [";", "ˑ"]]], ["Tone & intonation", [["/", "́"], ["//", "̋"], ["\\", "̀"], ["\\\\", "̏"], ["^", "̂"], ["%", "̌"], ["-", "̄"], ["<<", "ꜜ"], [">>", "ꜛ"], ["%%", "↗"], ["^^", "↘"]]], ["Phonation", [["0", "̥"], ["+", "̬"], ["?", "̰"], ["##", "̤"], ["#", "ʰ"]]], ["Nasalization", [["~", "̃"]]], ["Articulation", [["[", "̪"], ["]", "̺"], ["[[", "̼"], ["]]", "̻"], ["{", "̟"], ["}", "̠"], ["{{", "̘"], ["}}", "̙"], ["<", "̞"], [">", "̝"], ["(", "̜"], [")", "̹"], ["\"", "̈"], ["\"\"", "̽"]]], ["Syllabicity & release", [["=", "̩"], ["**", "̯"], ["*", "̆"], ["`", "̚"]]], ["Prosody & linking", [["'", "ˈ"], [",", "ˌ"], [".", "."], ["_", "‿"], ["&", "͡"]]],["Rhoticity",[["eR","ɝ"],["5R","ɚ"],["R","˞"]]]].map(([title, items]) => jsx`
          <div>
            <h3 style="font-size:12px;color:var(--ink3);margin:14px 0 6px;font-weight:600">${title}</h3>
            <div class="others">
              ${items.map(([k, mk]) => jsx`
                <div class="chip" title=${k}>
                  <span class="g">${mk.charCodeAt(0) >= 0x300 && mk.charCodeAt(0) < 0x370 ? "a" + mk : mk}</span>
                  <span class="kk">${k}</span>
                </div>`)}
            </div>
          </div>`)}
        <div class="others" style="margin-top:8px">
          <div class="chip"><span class="g">tʲ</span><span class="kk">$ = superscriptize</span></div>
        </div>

        <h2>Vowels
          <button onclick=${ontoggle} style="margin-left:10px;font-size:11px;padding:3px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--card);cursor:pointer;color:var(--ink2);text-transform:none;letter-spacing:0">
            ${vview === "art" ? "articulatory — show formants" : "F1/F2 acoustic — show articulatory"}
          </button>
        </h2>
        <div class="vowelbox"><div class="vwrap">
          ${vview === "art" ? jsx`
          <svg viewBox="0 0 100 100" preserveAspectRatio="none"
            style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
            <g stroke="var(--line2)" stroke-width="0.4" fill="none">
              <line x1="12" y1="6"  x2="88" y2="6" />
              <line x1="21" y1="34" x2="88" y2="34" />
              <line x1="30" y1="64" x2="88" y2="64" />
              <line x1="40" y1="92" x2="88" y2="92" />
              <line x1="12" y1="6"  x2="40" y2="92" />
              <line x1="46.5" y1="6" x2="54" y2="92" />
              <line x1="88" y1="6"  x2="88" y2="92" />
            </g>
          </svg>` : jsx`
          <div style="position:absolute;left:8px;top:2px;font-size:10px;color:var(--ink3)">← F2 (Hz)</div>
          <div style="position:absolute;left:2px;bottom:8px;font-size:10px;color:var(--ink3);writing-mode:vertical-rl">F1 (Hz) ↓</div>`}
          ${VOWELS.map(([g, ax, ay]) => {
            const key = GLYPH2KEY[g];
            let x = ax, y = ay;
            if (vview === "formant" && FORMANTS[g]) {
              const [F1, F2] = FORMANTS[g];
              x = 8 + (2400 - F2) / (2400 - 550) * 84;
              y = 6 + (F1 - 230) / (870 - 230) * 86;
            }
            return jsx`
              <div class="vp ${sel === g ? "sel" : ""}" style="left:${x}%;top:${y}%" onclick=${() => onpick(g)}>
                <span class="g ${key ? "" : "unmapped"}">${g}</span>
                ${key ? jsx`<span class="kk">${key}</span>` : null}
              </div>`;
          })}
        </div></div>
        <p class="legend">Full coverage. Drags: U/I pull to center, O/A pull back and open, E ligates, W flips rounding, H laxes. ə is the digit 5; its family: 5H ɜ, 5W ɞ, 5R ɚ. 6 = ɐ (X-SAMPA).</p>

        ${sel ? jsx`
          <div class="detail">
            <span class="big">${sel}</span>
            <div>
              <div class="kb">${selKey || "no Tier 1 route"}</div>
              <div class="cp">${[...sel].map((c) => "U+" + c.codePointAt(0).toString(16).toUpperCase().padStart(4, "0")).join(" ")}</div>
            </div>
            ${(FORMANTS[sel] || KIRSH[sel]) ? jsx`<button onclick=${onspeak} disabled=${busy}>${busy ? "…" : "▶ " + sel}</button>` : jsx`<span class="cp">no audio</span>`}
          </div>` : null}
      </div>`;
  }
}

renderer.render(jsx`<${App} />`, document.getElementById("app"));
</script>
</body>
</html>
